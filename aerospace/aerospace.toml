# AeroSpace config — ported from ~/.config/hypr/hyprland.lua
#
# Key decisions (change these two things first if you disagree):
#
# 1. mainMod: Hyprland used SUPER. macOS has no free "Super" key — Cmd is used
#    system-wide (Spotlight, Cmd+Tab, Cmd+Q/W...). Using Cmd as mainMod would
#    shadow those. Went with ALT (Option), which is the AeroSpace/i3 community
#    convention and leaves every native macOS shortcut untouched.
#    To use Cmd instead: replace every "alt-" below with "cmd-".
#
# 2. layout: Hyprland used "master" (one main window + stack). AeroSpace has
#    no master/stack layout. Went with "accordion" as the closest conceptual
#    match (one focused window prominent, rest collapsed behind it). "tiles"
#    (even binary-split, like dwindle/i3) is the other option — swap
#    default-root-container-layout below to try it.
#
# Things from hyprland.lua that have NO AeroSpace equivalent and were dropped:
#   - decoration/animations block (borders, blur, shadow, opacity, bezier
#     curves) — macOS renders native window chrome, AeroSpace only positions
#     windows, it doesn't draw them.
#   - XF86Audio*/XF86MonBrightness* binds — those are compositor/input-daemon
#     concerns on Linux; on macOS the F-row media keys already work natively,
#     nothing to configure.
#   - mainMod + mouse drag/resize (mouse:272/273) — AeroSpace doesn't do
#     click-drag window moving/resizing (it's a tiling WM, not a compositor).
#     Use native title-bar drag, or a tool like Rectangle/BetterTouchTool if
#     you want modifier+drag.
#   - mainMod + scroll to cycle workspaces — no mouse-scroll binding support
#     found in AeroSpace's docs.
#   - special:magic scratchpad — no scratchpad concept, and no binding was
#     added for it.

config-version = 2

after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 10
outer.right = 10
outer.top = 5
outer.bottom = 10 

# --- multi-monitor workspace assignment ---
# Mirrors the hyprland.lua rule that pinned workspaces 1-4 to eDP-1 (laptop
# panel). Fill in real monitor names once you know them: `aerospace
# list-monitors` will print them. Left commented out since a wrong monitor
# name is a silent no-op, not an error.
# [workspace-to-monitor-force-assignment]
# 1 = 'built-in'
# 2 = 'built-in'
# 3 = 'built-in'
# 4 = 'built-in'

[mode.main.binding]

# --- launchers / apps ---
alt-t = 'exec-and-forget open -a Ghostty'
alt-f = 'exec-and-forget open -a Finder'
alt-b = 'exec-and-forget open -a "Brave Browser"'

# rofi-run menu (SUPER+SPACE) — Spotlight already owns Cmd+Space untouched.
# Point this at whatever launcher you install (Raycast/Alfred):
# alt-space = 'exec-and-forget open -a Raycast'

# rofi-power menu (SUPER+S) — no scriptable macOS "power menu"; left for you
# to wire up (e.g. a shortcut/Automator action), so nothing destructive ships
# by default.
# alt-s = 'exec-and-forget open -a "Your Power Menu App"'

# rofi-clipboard (SUPER+SHIFT+V) — needs a clipboard manager app, e.g. Maccy:
# alt-shift-v = 'exec-and-forget open -a Maccy'

# hyprpicker -a (SUPER+P) — closest built-in is Digital Color Meter:
# alt-p = 'exec-and-forget open -a "Digital Color Meter"'

# rofi-screenshot (SUPER+PRINT) — native macOS screenshot shortcuts
# (Cmd+Shift+3/4/5) are untouched and already do this.

# hyprshutdown / exit (SUPER+M) — deliberately not bound to an actual
# log-out/shutdown command; that's a destructive one-key action. Wire it to
# your own confirm-first script if you want it:
# alt-m = 'exec-and-forget /path/to/your/logout-with-confirm.sh'

alt-c = 'close'
alt-shift-r = 'reload-config'
alt-v = 'layout floating tiling'
alt-e = 'layout tiles accordion'
alt-shift-f = 'fullscreen'

# --- focus with mainMod ---
alt-h = 'focus left'
alt-l = 'focus right'
alt-k = 'focus up'
alt-j = 'focus down'

# --- swap window ---
alt-shift-h = 'move left'
alt-shift-l = 'move right'
alt-shift-k = 'move up'
alt-shift-j = 'move down'

# --- resize active window (hold to repeat, same as hyprland repeating=true —
# macOS key-repeat handles this natively once the key is held) ---
alt-ctrl-h = 'resize width -50'
alt-ctrl-l = 'resize width +50'
alt-ctrl-k = 'resize height -50'
alt-ctrl-j = 'resize height +50'

# --- workspaces 1-0, same layout as hyprland's for-loop ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# --- window rules (on-window-detected) ---
# Most of hyprland.lua's window_rules were Linux/XWayland-specific
# (suppress-maximize-events, fix-xwayland-drags, thunar/bluetui/kcalc floats)
# and have no macOS equivalent. One illustrative example of the syntax,
# floating System Settings the way kcalc/thunar were floated:
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.toggl.daneel'
run = 'layout floating'
